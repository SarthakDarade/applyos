<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Identity - ApplyOS</title>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 0;
        }

        .wrapper {
            width: 100%;
            background-color: #050505;
            padding: 40px 0;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #0e0e11;
            border: 1px solid #1f1f23;
            border-radius: 24px;
            overflow: hidden;
        }

        .accent-glow {
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ec4899, transparent);
        }

        .header {
            padding: 40px 40px 20px;
            text-align: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            text-decoration: none;
        }

        .content {
            padding: 0 40px 40px;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 16px;
            color: #ffffff;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: #94a3b8;
            margin-bottom: 32px;
        }

        .button {
            display: inline-block;
            padding: 16px 36px;
            background: linear-gradient(135deg, #ec4899 0%, #be185d 100%);
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
        }

        .footer {
            padding: 32px 40px;
            background-color: #0a0a0d;
            border-top: 1px solid #1f1f23;
            text-align: center;
            font-size: 13px;
            color: #64748b;
        }

        .token {
            background-color: #1f1f23;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 20px;
            letter-spacing: 4px;
            color: #ffffff;
            margin-bottom: 32px;
            display: inline-block;
            border: 1px solid #333;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="container">
            <div class="accent-glow"></div>
            <div class="header">
                <a href="{{ .SiteURL }}" class="logo">ApplyOS</a>
            </div>
            <div class="content">
                <h1>Please Re-authenticate</h1>
                <p>For your protection, we need you to verify your identity before performing this sensitive action. Use
                    the button below to confirm it's really you.</p>
                <div class="button-container">
                    <a href="{{ .ConfirmationURL }}" class="button">Verify My Identity</a>
                </div>
                <p style="font-size: 14px; margin-top: 10px;">Or use this verification code:</p>
                <div class="token">{{ .Token }}</div>
            </div>
            <div class="footer">
                &copy; 2025 ApplyOS. Multi-layer protection for your data.
            </div>
        </div>
    </div>
</body>

</html>
